      </rect>
      <circle cx="300" cy="186.5" r="5.5" fill="#22D3EE" filter="url(#f_glow)" opacity="0">
        <animate attributeName="cx" from="300" to="751" dur="1.15s"
                 begin="0.72s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;1;1;.55" dur="1.15s"
                 begin="0.72s" fill="freeze"/>
      </circle>
      <text x="944" y="192" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5"
            fill="#8A97B1" class="f" style="animation-delay:1.47s">74%</text>
    </g>
    <g>
      <text x="26" y="231" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500"
            fill="#EEF2FB" class="f" style="animation-delay:0.73s">Business Strategy</text>
      <rect x="300" y="220" width="610" height="9" rx="4.5" fill="#2A3346" opacity=".55"/>
      <rect x="300" y="220" width="0" height="9" rx="4.5" fill="url(#f_brand)">
        <animate attributeName="width" from="0" to="427" dur="1.15s"
                 begin="0.83s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
      <circle cx="300" cy="224.5" r="5.5" fill="#22D3EE" filter="url(#f_glow)" opacity="0">
        <animate attributeName="cx" from="300" to="727" dur="1.15s"
                 begin="0.83s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;1;1;.55" dur="1.15s"
                 begin="0.83s" fill="freeze"/>
      </circle>
      <text x="944" y="230" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5"
            fill="#8A97B1" class="f" style="animation-delay:1.58s">70%</text>
    </g>
</svg>
