<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 132" width="1200" height="132" role="img"
     aria-label="Problem to Impact delivery pipeline">

  <defs>
    <linearGradient id="p_brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="45%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- gradiente que se desplaza: da el "shimmer" del titulo -->
    <linearGradient id="p_shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="30%"  stop-color="#3B82F6"/>
      <stop offset="55%"  stop-color="#22D3EE"/>
      <stop offset="80%"  stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="p_b1"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="1"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="p_b2"><stop offset="0%" stop-color="#22D3EE"   stop-opacity="1"/><stop offset="100%" stop-color="#22D3EE"   stop-opacity="0"/></radialGradient>
    <radialGradient id="p_b3"><stop offset="0%" stop-color="#E879F9" stop-opacity="1"/><stop offset="100%" stop-color="#E879F9" stop-opacity="0"/></radialGradient>

    <filter id="p_soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="p_glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="p_grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .f   { opacity:0; animation: rise .6s ease-out forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform:none;} }
    @keyframes hop  { 0%,72%,100% { opacity:.35; } 82% { opacity:1; } }
    .hop  { animation: hop 3s ease-in-out infinite; }
    .flow { stroke-dasharray: 14 210; animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -224; } }
  </style>

  <rect width="1200" height="132" rx="14" fill="#0D1220"/>
  <rect width="1200" height="132" rx="14" fill="url(#p_grid)"/>

  <path id="p_track" d="M96 56H1104" stroke="#2A3346" stroke-width="2" stroke-linecap="round"/>
  <path d="M96 56H1104" stroke="url(#p_brand)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="1008" stroke-dashoffset="1008" opacity=".85">
    <animate attributeName="stroke-dashoffset" from="1008" to="0" dur="1.6s" fill="freeze"/>
  </path>
  <path class="flow" d="M96 56H1104" stroke="#22D3EE" stroke-width="3.4"
        stroke-linecap="round" filter="url(#p_glow)" opacity=".9"/>

  <circle r="3.4" fill="#E879F9" filter="url(#p_glow)">
    <animateMotion dur="3s" repeatCount="indefinite" calcMode="linear">
      <mpath href="#p_track"/>
    </animateMotion>
  </circle>

  <g><circle cx="96.0" cy="56" r="6" fill="#080B14" stroke="url(#p_brand)" stroke-width="2"/><circle cx="96.0" cy="56" r="2.6" fill="url(#p_brand)" filter="url(#p_glow)" class="hop" style="animation-delay:0.00s"/><circle cx="264.0" cy="56" r="6" fill="#080B14" stroke="url(#p_brand)" stroke-width="2"/><circle cx="264.0" cy="56" r="2.6" fill="url(#p_brand)" filter="url(#p_glow)" class="hop" style="animation-delay:0.42s"/><circle cx="432.0" cy="56" r="6" fill="#080B14" stroke="url(#p_brand)" stroke-width="2"/><circle cx="432.0" cy="56" r="2.6" fill="url(#p_brand)" filter="url(#p_glow)" class="hop" style="animation-delay:0.84s"/><circle cx="600.0" cy="56" r="6" fill="#080B14" stroke="url(#p_brand)" stroke-width="2"/><circle cx="600.0" cy="56" r="2.6" fill="url(#p_brand)" filter="url(#p_glow)" class="hop" style="animation-delay:1.26s"/><circle cx="768.0" cy="56" r="6" fill="#080B14" stroke="url(#p_brand)" stroke-width="2"/><circle cx="768.0" cy="56" r="2.6" fill="url(#p_brand)" filter="url(#p_glow)" class="hop" style="animation-delay:1.68s"/><circle cx="936.0" cy="56" r="6" fill="#080B14" stroke="url(#p_brand)" stroke-width="2"/><circle cx="936.0" cy="56" r="2.6" fill="url(#p_brand)" filter="url(#p_glow)" class="hop" style="animation-delay:2.10s"/><circle cx="1104.0" cy="56" r="7.5" fill="#080B14" stroke="url(#p_brand)" stroke-width="2"/><circle cx="1104.0" cy="56" r="3.4" fill="url(#p_brand)" filter="url(#p_glow)" class="hop" style="animation-delay:2.52s"/></g>
  <g><text x="96.0" y="90" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.1" fill="#8A97B1" class="f" style="animation-delay:0.20s">PROBLEM</text><text x="264.0" y="90" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.1" fill="#8A97B1" class="f" style="animation-delay:0.29s">DISCOVERY</text><text x="432.0" y="90" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.1" fill="#8A97B1" class="f" style="animation-delay:0.38s">STRATEGY</text><text x="600.0" y="90" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.1" fill="#8A97B1" class="f" style="animation-delay:0.47s">ARCHITECTURE</text><text x="768.0" y="90" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.1" fill="#8A97B1" class="f" style="animation-delay:0.56s">ENGINEERING</text><text x="936.0" y="90" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.1" fill="#8A97B1" class="f" style="animation-delay:0.65s">DATA</text><text x="1104.0" y="90" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.1" fill="#EEF2FB" class="f" style="animation-delay:0.74s">IMPACT</text></g>
  <text x="600" y="120" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12"
        fill="#8A97B1" class="f" style="animation-delay:.9s" opacity="0">
    from product idea → architecture → code → measurable impact
  </text>
</svg>
