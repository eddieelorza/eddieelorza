name: Refresh GitHub stats

# Regenera assets/{stats,langs,activity}-*.svg desde la API de GitHub.
# Los SVG viven en el repo: si un servicio de terceros se cae, el README no.

on:
  schedule:
    - cron: "17 5 * * *"        # diario
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_stats.py"
      - "scripts/build_assets.py"
      - ".github/workflows/build-stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stat cards
        env:
          # PROFILE_TOKEN (PAT clasico, scope read:user) incluye las
          # contribuciones en repos privados. Sin el, cae al token de
          # Actions, que solo ve actividad publica.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stats.py "${{ github.repository_owner }}"

      - name: Validate SVG is well-formed XML
        run: |
          python3 - <<'PY'
          import glob, xml.dom.minidom
          for f in sorted(glob.glob("assets/*.svg")):
              xml.dom.minidom.parse(f)
              print("ok", f)
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore(stats): refresh GitHub stat cards"
          git push
