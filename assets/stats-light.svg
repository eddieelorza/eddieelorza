<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" width="600" height="190"
     role="img" aria-label="GitHub stats de eddieelorza">
  <defs>
    <linearGradient id="st_shim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1B2FD0"/>
      <stop offset="35%"  stop-color="#0B9B74"/>
      <stop offset="70%"  stop-color="#D9A800"/>
      <stop offset="100%" stop-color="#E8304A"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.5 0; 0.5 0; -0.5 0" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="st_rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B2FD0"/>
      <stop offset="60%" stop-color="#D9A800"/>
      <stop offset="100%" stop-color="#D9A800" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .m { opacity:0; animation: st_rise .6s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes st_rise { from {opacity:0; transform:translateY(9px);} to {opacity:1; transform:none;} }
  </style>

  <rect width="600" height="190" rx="16" fill="#FBF6EA"/>
  <rect x="0.5" y="0.5" width="599" height="189" rx="15.5" fill="none" stroke="#E4DCC6"/>

  <text x="46" y="42" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700"
        fill="#48507F" letter-spacing="2.4">GITHUB STATS</text>
  <rect x="46" y="52" width="200" height="2" rx="1" fill="url(#st_rule)"/>
  
  <g class="m" style="animation-delay:0.10s">
    <text x="46" y="86" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="38" font-weight="700"
          fill="url(#st_shim)" letter-spacing="-1">2,163</text>
    <text x="46" y="108" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600"
          fill="#101A78" letter-spacing="0.2">contributions</text>
    <text x="46" y="126" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#48507F">since 2021</text>
  </g>
  <g class="m" style="animation-delay:0.22s">
    <text x="222" y="86" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="38" font-weight="700"
          fill="url(#st_shim)" letter-spacing="-1">429</text>
    <text x="222" y="108" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600"
          fill="#101A78" letter-spacing="0.2">pull requests</text>
    <text x="222" y="126" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#48507F">merged &amp; open</text>
  </g>
  <g class="m" style="animation-delay:0.34s">
    <text x="398" y="86" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="38" font-weight="700"
          fill="url(#st_shim)" letter-spacing="-1">63</text>
    <text x="398" y="108" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600"
          fill="#101A78" letter-spacing="0.2">repositories</text>
    <text x="398" y="126" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#48507F">37 stars</text>
  </g>
  
  <g class="m" style="animation-delay:0.46s">
    <rect x="36" y="146" width="150" height="26" rx="13" fill="#FFFFFF" opacity="0.75"/>
    <text x="48" y="163.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#D9A800">12</text>
    <text x="66" y="163.5" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#48507F">day streak</text>
  </g>
  <g class="m" style="animation-delay:0.56s">
    <rect x="212" y="146" width="150" height="26" rx="13" fill="#FFFFFF" opacity="0.75"/>
    <text x="224" y="163.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#D9A800">12</text>
    <text x="242" y="163.5" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#48507F">best streak</text>
  </g>
  <g class="m" style="animation-delay:0.66s">
    <rect x="388" y="146" width="150" height="26" rx="13" fill="#FFFFFF" opacity="0.75"/>
    <text x="400" y="163.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#D9A800">176</text>
    <text x="427" y="163.5" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#48507F">active days</text>
