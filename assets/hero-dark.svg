<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 340" width="1200" height="340" role="img"
     aria-label="Eddie Elorza - AI Product Engineer">

  <defs>
    <linearGradient id="h_brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="45%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- gradiente que se desplaza: da el "shimmer" del titulo -->
    <linearGradient id="h_shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="30%"  stop-color="#3B82F6"/>
      <stop offset="55%"  stop-color="#22D3EE"/>
      <stop offset="80%"  stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="h_b1"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="1"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="h_b2"><stop offset="0%" stop-color="#22D3EE"   stop-opacity="1"/><stop offset="100%" stop-color="#22D3EE"   stop-opacity="0"/></radialGradient>
    <radialGradient id="h_b3"><stop offset="0%" stop-color="#E879F9" stop-opacity="1"/><stop offset="100%" stop-color="#E879F9" stop-opacity="0"/></radialGradient>

    <filter id="h_soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="h_glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="h_grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .f  { opacity:0; animation: rise .85s cubic-bezier(.22,.68,.24,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: none; } }
    @keyframes bar  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes node { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    .node { animation: node 3.6s ease-in-out infinite; }
    .rule { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
             animation: bar 1.1s cubic-bezier(.22,.68,.24,1) .5s forwards; }
    .caret { animation: node 1.05s steps(1) infinite; }
  </style>

  <rect width="1200" height="340" rx="16" fill="#080B14"/>
  <rect width="1200" height="340" rx="16" fill="url(#h_grid)"/>

  <g opacity="0.55" filter="url(#h_soft)">
    <circle cx="180" cy="90" r="190" fill="url(#h_b1)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 70 40; -30 20; 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="330" r="200" fill="url(#h_b2)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -80 -50; 50 -20; 0 0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="60" r="170" fill="url(#h_b3)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 40 60; -60 30; 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.30" filter="url(#h_soft)">
    <circle cx="975" cy="175" r="145" fill="url(#h_b1)"/>
  </g>

  <!-- red neuronal -->
  <g><path id="h_e0" d="M824 92L902 58" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="85.1" stroke-dashoffset="85.1"><animate attributeName="stroke-dashoffset" from="85.1" to="0" dur="1.1s" begin="0.25s" fill="freeze"/></path><path id="h_e1" d="M902 58L978 112" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="93.2" stroke-dashoffset="93.2"><animate attributeName="stroke-dashoffset" from="93.2" to="0" dur="1.1s" begin="0.30s" fill="freeze"/></path><path id="h_e2" d="M978 112L1056 68" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="89.6" stroke-dashoffset="89.6"><animate attributeName="stroke-dashoffset" from="89.6" to="0" dur="1.1s" begin="0.36s" fill="freeze"/></path><path id="h_e3" d="M1056 68L1126 132" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="94.8" stroke-dashoffset="94.8"><animate attributeName="stroke-dashoffset" from="94.8" to="0" dur="1.1s" begin="0.42s" fill="freeze"/></path><path id="h_e4" d="M824 92L858 176" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="90.6" stroke-dashoffset="90.6"><animate attributeName="stroke-dashoffset" from="90.6" to="0" dur="1.1s" begin="0.47s" fill="freeze"/></path><path id="h_e5" d="M858 176L942 196" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="86.3" stroke-dashoffset="86.3"><animate attributeName="stroke-dashoffset" from="86.3" to="0" dur="1.1s" begin="0.53s" fill="freeze"/></path><path id="h_e6" d="M942 196L978 112" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="91.4" stroke-dashoffset="91.4"><animate attributeName="stroke-dashoffset" from="91.4" to="0" dur="1.1s" begin="0.58s" fill="freeze"/></path><path id="h_e7" d="M978 112L1022 168" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="71.2" stroke-dashoffset="71.2"><animate attributeName="stroke-dashoffset" from="71.2" to="0" dur="1.1s" begin="0.64s" fill="freeze"/></path><path id="h_e8" d="M1022 168L1126 132" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="110.1" stroke-dashoffset="110.1"><animate attributeName="stroke-dashoffset" from="110.1" to="0" dur="1.1s" begin="0.69s" fill="freeze"/></path><path id="h_e9" d="M1022 168L1102 220" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="95.4" stroke-dashoffset="95.4"><animate attributeName="stroke-dashoffset" from="95.4" to="0" dur="1.1s" begin="0.74s" fill="freeze"/></path><path id="h_e10" d="M858 176L884 268" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="95.6" stroke-dashoffset="95.6"><animate attributeName="stroke-dashoffset" from="95.6" to="0" dur="1.1s" begin="0.80s" fill="freeze"/></path><path id="h_e11" d="M884 268L976 280" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="92.8" stroke-dashoffset="92.8"><animate attributeName="stroke-dashoffset" from="92.8" to="0" dur="1.1s" begin="0.85s" fill="freeze"/></path><path id="h_e12" d="M976 280L942 196" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="90.6" stroke-dashoffset="90.6"><animate attributeName="stroke-dashoffset" from="90.6" to="0" dur="1.1s" begin="0.91s" fill="freeze"/></path><path id="h_e13" d="M976 280L1062 292" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="86.8" stroke-dashoffset="86.8"><animate attributeName="stroke-dashoffset" from="86.8" to="0" dur="1.1s" begin="0.96s" fill="freeze"/></path><path id="h_e14" d="M1062 292L1102 220" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="82.4" stroke-dashoffset="82.4"><animate attributeName="stroke-dashoffset" from="82.4" to="0" dur="1.1s" begin="1.02s" fill="freeze"/></path><path id="h_e15" d="M1102 220L1126 132" stroke="url(#h_brand)" stroke-width="1.1" stroke-opacity=".45" fill="none" stroke-dasharray="91.2" stroke-dashoffset="91.2"><animate attributeName="stroke-dashoffset" from="91.2" to="0" dur="1.1s" begin="1.07s" fill="freeze"/></path><circle cx="824" cy="92" r="2.8" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:0.00s"/><circle cx="902" cy="58" r="2.8" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:0.31s"/><circle cx="978" cy="112" r="4.2" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:0.62s"/><circle cx="1056" cy="68" r="2.8" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:0.93s"/><circle cx="1126" cy="132" r="2.8" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:1.24s"/><circle cx="858" cy="176" r="4.2" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:1.55s"/><circle cx="942" cy="196" r="2.8" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:1.86s"/><circle cx="1022" cy="168" r="2.8" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:2.17s"/><circle cx="1102" cy="220" r="2.8" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:2.48s"/><circle cx="884" cy="268" r="2.8" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:2.79s"/><circle cx="976" cy="280" r="4.2" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:3.10s"/><circle cx="1062" cy="292" r="2.8" fill="url(#h_brand)" filter="url(#h_glow)" class="node" style="animation-delay:3.41s"/><circle r="2.6" fill="#22D3EE" filter="url(#h_glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="5.5s" begin="1.2s" repeatCount="indefinite"/><animateMotion dur="5.5s" begin="1.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#h_e1"/></animateMotion></circle><circle r="2.6" fill="#22D3EE" filter="url(#h_glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="6.4s" begin="2.6s" repeatCount="indefinite"/><animateMotion dur="6.4s" begin="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#h_e7"/></animateMotion></circle><circle r="2.6" fill="#22D3EE" filter="url(#h_glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="5.0s" begin="3.8s" repeatCount="indefinite"/><animateMotion dur="5.0s" begin="3.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#h_e12"/></animateMotion></circle></g>

  <!-- texto -->
  <g font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <g class="f" style="animation-delay:.05s">
      <rect x="64" y="62" width="9" height="9" rx="2" fill="#22D3EE"/>
      <text x="86" y="71" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="3.4"
            fill="#8A97B1">AI · PRODUCT · ENGINEERING</text>
    </g>

    <text class="f" style="animation-delay:.16s" x="62" y="158" font-size="66" font-weight="800"
          letter-spacing="-2.2" fill="url(#h_shimmer)">Eddie Elorza</text>

    <text class="f" style="animation-delay:.28s" x="65" y="196" font-size="20" font-weight="500"
          fill="#EEF2FB" opacity=".92">Building intelligent products from idea to production.</text>

    <text class="f" style="animation-delay:.38s" x="65" y="226" font-size="15" fill="#8A97B1">
      Product strategy · AI systems · Frontend architecture · Fintech
    </text>

    <rect class="rule" x="64" y="252" width="330" height="2.5" rx="2" fill="url(#h_brand)"/>

    <g class="f" style="animation-delay:.62s" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8A97B1">
      <text x="64" y="288">
        <tspan fill="#22D3EE">~</tspan> Mexico City, MX
        <tspan fill="#2A3346">  |  </tspan>MSc Applied AI
        <tspan fill="#2A3346">  |  </tspan>PSPO I
        <tspan fill="#2A3346">  |  </tspan>6+ yrs fintech<tspan class="caret" fill="#22D3EE">_</tspan>
      </text>
    </g>
  </g>
</svg>
