name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"     # 2 veces al dia
  workflow_dispatch:            # boton manual en la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colores alineados con la paleta del README (violeta -> cyan)
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%238B5CF6&color_dots=%23131A2B,%233B0764,%235B21B6,%238B5CF6,%2322D3EE
            dist/snake-light.svg?color_snake=%236D28D9&color_dots=%23EDF0F7,%23DDD6FE,%23A78BFA,%236D28D9,%230891B2

      - name: Push to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
