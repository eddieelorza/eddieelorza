<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" width="600" height="190"
     role="img" aria-label="GitHub stats de eddieelorza">
  <defs>
    <linearGradient id="st_shim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="35%"  stop-color="#3B82F6"/>
      <stop offset="70%"  stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#E879F9"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.5 0; 0.5 0; -0.5 0" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="st_rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .m { opacity:0; animation: st_rise .6s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes st_rise { from {opacity:0; transform:translateY(9px);} to {opacity:1; transform:none;} }
  </style>

  <rect width="600" height="190" rx="16" fill="#0D1220"/>
  <rect x="0.5" y="0.5" width="599" height="189" rx="15.5" fill="none" stroke="#2A3346"/>

  <text x="46" y="42" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700"
        fill="#8A97B1" letter-spacing="2.4">GITHUB STATS</text>
  <rect x="46" y="52" width="200" height="2" rx="1" fill="url(#st_rule)"/>
  
  <g class="m" style="animation-delay:0.10s">
    <text x="46" y="86" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="38" font-weight="700"
          fill="url(#st_shim)" letter-spacing="-1">699</text>
    <text x="46" y="108" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600"
          fill="#EEF2FB" letter-spacing="0.2">contributions</text>
    <text x="46" y="126" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A97B1">since 2021</text>
  </g>
  <g class="m" style="animation-delay:0.22s">
    <text x="222" y="86" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="38" font-weight="700"
          fill="url(#st_shim)" letter-spacing="-1">172</text>
    <text x="222" y="108" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600"
          fill="#EEF2FB" letter-spacing="0.2">pull requests</text>
    <text x="222" y="126" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A97B1">merged &amp;amp; open</text>
  </g>
  <g class="m" style="animation-delay:0.34s">
    <text x="398" y="86" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="38" font-weight="700"
          fill="url(#st_shim)" letter-spacing="-1">62</text>
    <text x="398" y="108" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600"
          fill="#EEF2FB" letter-spacing="0.2">repositories</text>
    <text x="398" y="126" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A97B1">37 stars</text>
  </g>
  
  <g class="m" style="animation-delay:0.46s">
    <rect x="36" y="146" width="150" height="26" rx="13" fill="#131A2B" opacity="0.75"/>
    <text x="48" y="163.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22D3EE">1</text>
    <text x="57" y="163.5" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A97B1">day streak</text>
  </g>
  <g class="m" style="animation-delay:0.56s">
    <rect x="212" y="146" width="150" height="26" rx="13" fill="#131A2B" opacity="0.75"/>
    <text x="224" y="163.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22D3EE">6</text>
    <text x="233" y="163.5" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A97B1">best streak</text>
  </g>
  <g class="m" style="animation-delay:0.66s">
    <rect x="388" y="146" width="150" height="26" rx="13" fill="#131A2B" opacity="0.75"/>
    <text x="400" y="163.5" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#22D3EE">137</text>
    <text x="427" y="163.5" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8A97B1">active days</text>
  </g>
</svg>
