<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 607 312" width="607" height="312"
     role="img" aria-label="AI TOOLING: Claude Code, Cursor, Warp, Ollama · AGENTIC LAYER: Coding agents, MCP servers, Skills, Guard-rails, Evals · ARCHITECTURE: Module Federation, qiankun, Microfrontends · TESTING: Jest, Testing Library, Playwright · PRODUCT OPS: Jira, Miro">

  <defs>
    <linearGradient id="t_brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="45%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- gradiente que se desplaza: da el "shimmer" del titulo -->
    <linearGradient id="t_shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="30%"  stop-color="#3B82F6"/>
      <stop offset="55%"  stop-color="#22D3EE"/>
      <stop offset="80%"  stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="t_b1"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="1"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="t_b2"><stop offset="0%" stop-color="#22D3EE"   stop-opacity="1"/><stop offset="100%" stop-color="#22D3EE"   stop-opacity="0"/></radialGradient>
    <radialGradient id="t_b3"><stop offset="0%" stop-color="#E879F9" stop-opacity="1"/><stop offset="100%" stop-color="#E879F9" stop-opacity="0"/></radialGradient>

    <filter id="t_soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="t_glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="t_grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .p { opacity:0; animation: t_pop .5s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes t_pop { from {opacity:0; transform:translateY(7px);} to {opacity:1; transform:none;} }
  </style>
