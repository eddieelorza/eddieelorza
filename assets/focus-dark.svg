<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 266" width="1000" height="266"
     role="img" aria-label="Current focus areas">

  <defs>
    <linearGradient id="f_brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="45%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- gradiente que se desplaza: da el "shimmer" del titulo -->
    <linearGradient id="f_shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="30%"  stop-color="#3B82F6"/>
      <stop offset="55%"  stop-color="#22D3EE"/>
      <stop offset="80%"  stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="f_b1"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="1"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="f_b2"><stop offset="0%" stop-color="#22D3EE"   stop-opacity="1"/><stop offset="100%" stop-color="#22D3EE"   stop-opacity="0"/></radialGradient>
    <radialGradient id="f_b3"><stop offset="0%" stop-color="#E879F9" stop-opacity="1"/><stop offset="100%" stop-color="#E879F9" stop-opacity="0"/></radialGradient>

    <filter id="f_soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="f_glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="f_grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .f { opacity:0; animation: rise .55s ease-out forwards; }
    @keyframes rise { from {opacity:0; transform:translateX(-8px);} to {opacity:1; transform:none;} }
  </style>
  <rect width="1000" height="266" rx="14" fill="#0D1220"/>
  <rect width="1000" height="266" rx="14" fill="url(#f_grid)"/>
  
    <g>
      <text x="26" y="41" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500"
            fill="#EEF2FB" class="f" style="animation-delay:0.18s">AI Product Management</text>
      <rect x="300" y="30" width="610" height="9" rx="4.5" fill="#2A3346" opacity=".55"/>
      <rect x="300" y="30" width="0" height="9" rx="4.5" fill="url(#f_brand)">
        <animate attributeName="width" from="0" to="580" dur="1.15s"
                 begin="0.28s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
      <circle cx="300" cy="34.5" r="5.5" fill="#22D3EE" filter="url(#f_glow)" opacity="0">
        <animate attributeName="cx" from="300" to="880" dur="1.15s"
                 begin="0.28s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;1;1;.55" dur="1.15s"
                 begin="0.28s" fill="freeze"/>
      </circle>
      <text x="944" y="40" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5"
            fill="#8A97B1" class="f" style="animation-delay:1.03s">95%</text>
    </g>
    <g>
      <text x="26" y="79" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500"
            fill="#EEF2FB" class="f" style="animation-delay:0.29s">AI Agents &amp; Orchestration</text>
      <rect x="300" y="68" width="610" height="9" rx="4.5" fill="#2A3346" opacity=".55"/>
      <rect x="300" y="68" width="0" height="9" rx="4.5" fill="url(#f_brand)">
        <animate attributeName="width" from="0" to="549" dur="1.15s"
                 begin="0.39s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
      <circle cx="300" cy="72.5" r="5.5" fill="#22D3EE" filter="url(#f_glow)" opacity="0">
        <animate attributeName="cx" from="300" to="849" dur="1.15s"
                 begin="0.39s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;1;1;.55" dur="1.15s"
                 begin="0.39s" fill="freeze"/>
      </circle>
      <text x="944" y="78" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5"
            fill="#8A97B1" class="f" style="animation-delay:1.14s">90%</text>
    </g>
    <g>
      <text x="26" y="117" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500"
            fill="#EEF2FB" class="f" style="animation-delay:0.40s">Product Analytics</text>
      <rect x="300" y="106" width="610" height="9" rx="4.5" fill="#2A3346" opacity=".55"/>
      <rect x="300" y="106" width="0" height="9" rx="4.5" fill="url(#f_brand)">
        <animate attributeName="width" from="0" to="500" dur="1.15s"
                 begin="0.50s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
      <circle cx="300" cy="110.5" r="5.5" fill="#22D3EE" filter="url(#f_glow)" opacity="0">
        <animate attributeName="cx" from="300" to="800" dur="1.15s"
                 begin="0.50s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;1;1;.55" dur="1.15s"
                 begin="0.50s" fill="freeze"/>
      </circle>
      <text x="944" y="116" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5"
            fill="#8A97B1" class="f" style="animation-delay:1.25s">82%</text>
    </g>
    <g>
      <text x="26" y="155" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500"
            fill="#EEF2FB" class="f" style="animation-delay:0.51s">Digital Transformation</text>
      <rect x="300" y="144" width="610" height="9" rx="4.5" fill="#2A3346" opacity=".55"/>
      <rect x="300" y="144" width="0" height="9" rx="4.5" fill="url(#f_brand)">
        <animate attributeName="width" from="0" to="476" dur="1.15s"
                 begin="0.61s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
      <circle cx="300" cy="148.5" r="5.5" fill="#22D3EE" filter="url(#f_glow)" opacity="0">
        <animate attributeName="cx" from="300" to="776" dur="1.15s"
                 begin="0.61s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;1;1;.55" dur="1.15s"
